<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信跳一跳 · Jump Jump</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23dce5dd'/><circle cx='32' cy='20' r='9' fill='%231e293b'/><path d='M21 50l6-22h10l6 22z' fill='%231e293b'/></svg>">
    <link rel="stylesheet" href="style.css?v=20261118_1135">
</head>
<body>
    <main class="jj-stage">
        <div class="canvas-wrap">
            <canvas id="jumpCanvas" width="660" height="680"></canvas>

            <!-- Minimal WeChat-inspired floating HUD -->
            <div class="hud-top-left">
                <div class="big-score" id="scoreVal">0</div>
                <div class="sub-meta">
                    <span>最高 <b id="bestVal">0</b></span>
                    <span class="streak-tag" id="streakWrap" hidden>连击 <b id="streakVal">×0</b></span>
                </div>
            </div>

            <div class="hud-top-right">
                <a href="../index.html" class="hud-btn">← 大厅</a>
                <button class="hud-btn" id="btnRestart" type="button">重开</button>
                <button class="hud-btn icon-btn" id="btnMute" type="button" title="音效开关">🔊</button>
            </div>

            <div class="whisper-hint" id="whisperHint">
                按住 <b>鼠标左键 / 触屏</b> 或 <b>空格键</b> 蓄力，松开起跳
            </div>
        </div>
    </main>

    <!-- Clean Settlement Overlay -->
    <div class="modal-backdrop hidden" id="overModal" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="over-badge" id="overBadge">GAME OVER</div>
            <h2 id="overTitle">本局得分</h2>
            <div class="over-score" id="overScore">0</div>
            <div class="over-stats">
                <div class="os-box"><span>历史最高</span><b id="overBest">0</b></div>
                <div class="os-box"><span>跳跃步数</span><b id="overJumps">0</b></div>
                <div class="os-box"><span>最佳连击</span><b id="overCombo">×0</b></div>
            </div>
            <button class="cta-btn" id="btnPlayAgain" type="button">再来一局 <small>[空格 / Enter]</small></button>
        </div>
    </div>

    <script src="engine.js?v=20261117_1800"></script>
    <script src="audio.js?v=20261117_1800"></script>
    <script src="game.js?v=20261118_2200"></script>
</body>
</html>
