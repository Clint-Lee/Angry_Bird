<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔塔 · 30层深渊试炼 | 云檐趣阁小游戏厅</title>
    <link rel="stylesheet" href="style.css?v=20261118_1740">
</head>
<body>
    <div class="mt-shell">
        <header class="mt-topbar">
            <div class="top-left">
                <a href="../index.html" class="nav-pill">← 大厅</a>
                <div class="floor-head">
                    <span class="zone-pill" id="zoneBadge">遗迹石窟</span>
                    <h1 id="floorTitle">第 1 / 30 层 · 魔塔正门</h1>
                </div>
            </div>
            <div class="top-right">
                <button class="nav-pill" id="btnManual" type="button" title="当前楼层怪物图鉴 [M]">图鉴 (M)</button>
                <button class="nav-pill" id="btnFlyer" type="button" title="已探索楼层快速传送 [F]">传送 (F)</button>
                <button class="nav-pill active" id="btnDmgOverlay" type="button" title="切换怪物显伤开关 [H]">显伤: 开</button>
                <button class="nav-pill active" id="btnBattleAnim" type="button" title="设置是否开启或跳过战斗动画 [B]">战斗动画: 开</button>
                <button class="nav-pill" id="btnUndo" type="button" title="回溯上一步 [Z]">撤销 (Z)</button>
                <button class="nav-pill" id="btnRestart" type="button" title="重新开始魔塔">重开</button>
                <button class="nav-pill icon-only" id="btnMute" type="button" title="音效开关">🔊</button>
            </div>
        </header>

        <main class="mt-workspace">
            <!-- Left Hero & Tactical HUD (minimum 14px typography throughout) -->
            <aside class="hero-panel">
                <div class="panel-card hero-card">
                    <div class="hero-identity">
                        <canvas id="heroAvatarCanvas" class="hero-avatar" width="42" height="42"></canvas>
                        <div class="hero-lv-meta">
                            <div class="hero-row-head">
                                <span class="lv-badge" id="lvVal">Lv.1</span>
                                <span class="exp-hint" id="expNeedVal">0 / 60 EXP</span>
                            </div>
                            <div class="exp-bar-track"><div class="exp-bar-fill" id="expBarFill"></div></div>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-cell hp"><span>生命</span><b id="hpVal">1100</b></div>
                        <div class="stat-cell atk"><span>攻击</span><b id="atkVal">14</b></div>
                        <div class="stat-cell def"><span>防御</span><b id="defVal">10</b></div>
                        <div class="stat-cell gold"><span>金币</span><b id="goldVal">80</b></div>
                    </div>
                    <div class="equip-stack">
                        <div class="equip-line"><span class="eq-tag">武器</span><b id="weaponVal">木剑</b></div>
                        <div class="equip-line"><span class="eq-tag">防具</span><b id="shieldVal">布衣</b></div>
                    </div>
                </div>

                <div class="panel-card">
                    <div class="card-head-row">
                        <span class="card-subhead">钥匙背包</span>
                        <span class="card-sub-hint">按颜色开锁</span>
                    </div>
                    <div class="keys-row">
                        <div class="key-pill yellow">
                            <svg class="k-svg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="6.5" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10h7M14 10v3M16.5 10v2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <span>黄</span><b id="keyY">2</b>
                        </div>
                        <div class="key-pill blue">
                            <svg class="k-svg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="6.5" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10h7M14 10v3M16.5 10v2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <span>蓝</span><b id="keyB">0</b>
                        </div>
                        <div class="key-pill red">
                            <svg class="k-svg" viewBox="0 0 20 20" aria-hidden="true"><circle cx="6.5" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10h7M14 10v3M16.5 10v2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                            <span>红</span><b id="keyR">0</b>
                        </div>
                    </div>
                </div>

                <div class="panel-card forecast-card" id="forecastCard">
                    <div class="card-head-row">
                        <span class="card-subhead">怪物情报 / 预测</span>
                        <span class="card-sub-hint" id="forecastHintTag">悬停或贴近</span>
                    </div>
                    <div id="forecastBody" class="forecast-empty">
                        <div class="key-hints-grid">
                            <span><b>WASD</b> / 点击寻路</span>
                            <span><b>M</b> 本层怪物图鉴</span>
                            <span><b>Z</b> 撤销上一步</span>
                            <span><b>F</b> 楼层快速传送</span>
                        </div>
                    </div>
                </div>

                <div class="dpad-card">
                    <div class="dpad">
                        <button type="button" class="d-btn" data-dir="0,-1" aria-label="上">▲</button>
                        <div class="dpad-mid">
                            <button type="button" class="d-btn" data-dir="-1,0" aria-label="左">◀</button>
                            <button type="button" class="d-btn" data-dir="0,1" aria-label="下">▼</button>
                            <button type="button" class="d-btn" data-dir="1,0" aria-label="右">▶</button>
                        </div>
                    </div>
                    <div class="milestone-info">
                        <span class="milestone-tag">10F · 20F · 30F Boss</span>
                        <span class="save-note" id="saveNote">每步可撤销 · 自动存档</span>
                    </div>
                </div>
            </aside>

            <!-- Center 15x15 Map Canvas -->
            <section class="board-stage">
                <div class="board-frame" id="boardFrame">
                    <canvas id="motaCanvas" width="660" height="660"></canvas>

                    <!-- Snappy Canvas RPG Duel Overlay -->
                    <div class="battle-overlay hidden" id="battleOverlay">
                        <div class="battle-box">
                            <div class="battle-head">
                                <div class="battle-title-group">
                                    <span class="battle-tag" id="battleEnemyBadge">交锋</span>
                                    <span class="battle-round" id="battleRoundTag">第 1 合</span>
                                </div>
                                <button type="button" class="nav-pill" id="btnSkipBattleNow">跳过 (Space)</button>
                            </div>
                            <canvas id="battleStageCanvas" width="460" height="184"></canvas>
                            <div class="battle-hud-bars">
                                <div class="bhud-side hero">
                                    <div class="bhud-top">
                                        <strong>勇者</strong>
                                        <span class="hp-bar-text" id="heroHpText">HP 1100</span>
                                    </div>
                                    <div class="hp-bar-track"><div class="hp-bar-fill hero" id="heroHpBar"></div></div>
                                    <span class="fighter-stats" id="heroBattleStats">攻 14 · 防 10</span>
                                </div>
                                <div class="bhud-side enemy">
                                    <div class="bhud-top">
                                        <strong id="enemyBattleName">史莱姆</strong>
                                        <span class="hp-bar-text" id="enemyHpText">HP 45</span>
                                    </div>
                                    <div class="hp-bar-track"><div class="hp-bar-fill enemy" id="enemyHpBar"></div></div>
                                    <span class="fighter-stats" id="enemyBattleStats">攻 16 · 防 2</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="toast-strip" id="toastStrip">欢迎来到 30 层魔塔试炼！每 10 层设有守关 Boss，量力而行、步步为营。</div>
            </section>
        </main>
    </div>

    <!-- Modal: Monster Manual / Flyer / Shop / Dialog / Unbeatable Alert / Win -->
    <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true">
        <div class="modal-card" id="modalCard">
            <div class="modal-head">
                <div>
                    <span class="modal-eyebrow" id="modalEyebrow">系统</span>
                    <h2 id="modalTitle">标题</h2>
                </div>
                <button class="close-btn" id="btnCloseModal" type="button">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="engine.js?v=20261118_1740"></script>
    <script src="audio.js?v=20261118_1740"></script>
    <script src="game.js?v=20261118_1740"></script>
</body>
</html>
