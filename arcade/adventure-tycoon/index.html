<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冒险家商店物语 · 奇幻商铺经营</title>
    <link rel="stylesheet" href="style.css?v=20261118_1135">
</head>
<body>
    <div class="at-shell">
        <header class="topbar">
            <div class="top-left">
                <a href="../index.html" class="nav-pill">← 大厅</a>
                <div class="title-group">
                    <span class="shop-badge" id="shopLevelBadge">Lv.1 小店</span>
                    <h1>冒险家商店物语</h1>
                </div>
            </div>
            <div class="top-right">
                <div class="currency-pill gold-pill">
                    <span>金币</span>
                    <b id="goldVal">60 G</b>
                </div>
                <div class="currency-pill rep-pill" title="声望越高，店铺等级与VIP收益越高">
                    <span>声望</span>
                    <b id="repVal">0</b>
                </div>
                <div class="currency-pill max-pill" title="历史最高金币记录">
                    <span>最高</span>
                    <b id="maxGoldVal">60 G</b>
                </div>
                <button class="action-pill" id="btnRushBell" type="button" title="敲响招客铃：10秒内全品售价 +35% 且客流翻倍">🔔 招客热卖</button>
                <button class="action-pill" id="btnPrestige" type="button" title="总营收满 3000G 可开启分店转生，永久 +35% 售价加成">开设分店</button>
                <button class="action-pill" id="btnMute" type="button" title="音效开关">🔊</button>
            </div>
        </header>

        <!-- Live VIP Special Order Banner -->
        <div class="vip-banner hidden" id="vipBanner">
            <div class="vip-left">
                <span class="vip-tag">王室悬赏</span>
                <span id="vipDesc">需求：生命药水 ×2 · 奖励：104 G + 9 声望</span>
                <span class="vip-timer" id="vipTimer">30s</span>
            </div>
            <button class="vip-btn" id="btnFulfillVip" type="button">交付委托</button>
        </div>

        <!-- Living Interactive Shop Floor Canvas -->
        <section class="canvas-stage">
            <canvas id="shopCanvas" width="680" height="340"></canvas>
            <div class="mat-strip" id="matStrip"></div>
        </section>

        <!-- 3-Column Management Controls -->
        <main class="mgmt-grid">
            <!-- Col 1: Expeditions -->
            <section class="panel-box">
                <div class="box-head">
                    <h2>秘境探险</h2>
                    <span class="box-sub">点击传送门加速采集</span>
                </div>
                <div class="zones-list" id="zonesList"></div>
            </section>

            <!-- Col 2: Crafting Workbench & Shelves -->
            <section class="panel-box">
                <div class="box-head">
                    <h2>工坊锻造与货架</h2>
                    <span class="box-sub" id="shelfCapText">上限 5</span>
                </div>
                <div class="recipes-list" id="recipesList"></div>
            </section>

            <!-- Col 3: Staff Automation & Upgrades -->
            <section class="panel-box">
                <div class="box-head">
                    <h2>店员与升级</h2>
                    <span class="box-sub" id="prestigeMultText">倍率 ×1.00</span>
                </div>
                <div class="upgrades-list" id="upgradesList"></div>
            </section>
        </main>
    </div>

    <div class="toast-banner hidden" id="offlineToast"></div>

    <script src="engine.js?v=20261117_2045"></script>
    <script src="audio.js?v=20261117_2045"></script>
    <script src="game.js?v=20261117_2045"></script>
</body>
</html>
